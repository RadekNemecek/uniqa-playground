<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001A31" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Mučírna: interaktivní hry pro školení týmů. Pojišťuj! je deska pro týmy, Na kolik to dáš? je kvíz do telefonů. Vlastní otázky, hraje se na plátno." />

    <!-- Odkaz se sdílí v Teams a v mailu, tak ať není holý. Karta je široká
         1200x630, protože čtvercovou ikonu Teams i pošta ořízne nebo
         zmenší do rohu.

         Adresy musí být absolutní. Náhled si nekreslí prohlížeč, ale server
         Teamsů nebo pošty, a ten relativní cestu nemá k čemu vztáhnout:
         karta by zůstala bez obrázku. Když se aplikace přestěhuje jinam,
         mění se tyhle dva řádky. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://radeknemecek.github.io/uniqa-playground/" />
    <meta property="og:title" content="Mučírna: školicí hry pro týmy" />
    <meta property="og:description" content="Dvě hry na jedno plátno. Pojišťuj! je deska kategorií a bodů pro týmy, Na kolik to dáš? je kvíz, do kterého se účastníci připojí telefonem. Otázky si píšeš sama." />
    <meta property="og:image" content="https://radeknemecek.github.io/uniqa-playground/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="cs_CZ" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Autorství strojově. Aplikace je SPA, takže robot, který nespustí
         skripty, vidí jen tenhle soubor. Odkaz v patě rozcestníku je pro
         lidi, tohle je jeho protějšek. -->
    <meta name="author" content="Radek Němeček" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "inLanguage": "cs",
        "author": {
          "@type": "Person",
          "name": "Radek Němeček",
          "url": "https://radeknemecek.cz/"
        }
      }
    </script>

    <title>Mučírna</title>
  </head>
