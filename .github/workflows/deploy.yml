name: Nasazení na Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Kontrola typů a sestavení
        run: npm run build

      # Pravidla jdou napřed. Nová verze aplikace může zapisovat něco, co
      # staré pravidlo odmítne, opačně to zatím nikdy nebylo. Ruční
      # publikování v konzoli se dvakrát zapomnělo, proto je to tady.
      - name: Nasazení pravidel Firestore
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNIQA_PLAYGROUND }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@15 deploy --only firestore:rules \
            --project uniqa-playground --non-interactive
          rm "$RUNNER_TEMP/sa.json"

      - name: Nasazení aplikace
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNIQA_PLAYGROUND }}
          projectId: uniqa-playground
          channelId: live
